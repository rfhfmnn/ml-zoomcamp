apiVersion: apps/v1
kind: Deployment
metadata:
  name: independiente-predictor
  labels:
    app: independiente-predictor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: independiente-predictor
  template:
    metadata:
      labels:
        app: independiente-predictor
    spec:
      containers:
      - name: predictor
        image: independiente-predictor:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9696
        env:
        - name: OPTIMAL_THRESHOLD
          value: "0.41"
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /ping
            port: 9696
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 9696
          initialDelaySeconds: 3
          periodSeconds: 5
